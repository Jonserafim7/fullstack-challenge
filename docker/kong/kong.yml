_format_version: "3.0"

services:
  - name: games-service
    url: http://games:4001
    routes:
      - name: games-routes
        paths:
          - /games
        strip_path: true
    # Higher per-IP ceiling than wallets: games is read-heavy (snapshot/history) and carries the WebSocket.
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          hour: 12000
          policy: local
          limit_by: ip
          fault_tolerant: true
          error_code: 429

  - name: wallets-service
    url: http://wallets:4002
    routes:
      - name: wallets-routes
        paths:
          - /wallets
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          hour: 6000
          policy: local
          limit_by: ip
          fault_tolerant: true
          error_code: 429

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600
