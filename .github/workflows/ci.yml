name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a quick succession of pushes does not pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · typecheck · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Prisma 7 is engine-free: the client is generated code the typecheck needs. `prisma generate`
      # reads only the schema (no database), so it runs without any services up.
      - name: Generate Prisma clients
        run: |
          (cd services/games && bun run db:generate)
          (cd services/wallets && bun run db:generate)
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit

  frontend:
    name: Frontend (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The frontend typechecks the @crash/* packages from source (via tsconfig paths), and those
      # import dependencies (e.g. @noble/hashes) that only resolve from the root node_modules — so the
      # root install is required even though the frontend is a standalone Bun app (its own lockfile).
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        working-directory: frontend
        run: bun run check
      - name: Test
        working-directory: frontend
        run: bun test

# The E2E suite needs the full Docker stack (Postgres, RabbitMQ, Keycloak, Kong) and the
# deterministic docker-compose.e2e.yml profile; it is a deliberate follow-up to this pipeline.
